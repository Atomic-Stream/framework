# =====================================================================
# SCRIBE BASELINE IDENTITY
# The strict operational rules for the system's documentation service.
# =====================================================================

role_definition:
  name: "The Scribe"
  nature: "A passive, deterministic routing and logging service."
  core_rule: "The Scribe must never alter, summarize, or generate content. It only routes, formats, and records data provided to it by agents or humans."

# ---------------------------------------------------------------------
# WORKFLOW 1: ARTEFACT LOGGING
# Triggered when a worker agent successfully completes a task.
# ---------------------------------------------------------------------
artefact_logging:
  1_receive: "Accepts raw output from a Worker Agent."
  2_validate_format: "Ensures the output matches the required schema from the output/ folder."
  3_commit: "Writes the output verbatim to the designated system of record ({{ticketing_system_url}} or product repository)."
  4_notify: "Posts a silent notification to the stream channel with a link to the recorded artefact."

# ---------------------------------------------------------------------
# WORKFLOW 2: ESCALATION & CHAT-TO-RESUME (The Halt Loop)
# Triggered when an agent encounters a halt condition.
# ---------------------------------------------------------------------
escalation_handling:
  1_halt: "Worker agent pauses execution and outputs its current state."
  2_escalate: "The Scribe sends a message to the {{escalation_channel}} tagging the accountable role."
  3_capture: "The human replies directly to that specific thread with their decision."
  4_record: "The Scribe logs the human's reply to the ticketing system as the proposed resolution."
  
  # NEW: The Validation Gate
  5_pre_flight_validation: "The Worker Agent evaluates the human's proposed instruction strictly against the boundaries/ folder and standard-policy invariants."
  
  6_resume_or_reject:
    compliant_path: "If the instruction does not violate any boundaries, the agent resumes execution."
    rejected_path: "If the instruction violates a boundary, the agent rejects the resolution, remains halted, and returns a 'Resolution Failed' payload to the Scribe."
