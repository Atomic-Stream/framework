---
# =====================================================================
# ATOMIC STREAM: ROOT CONFIGURATION TEMPLATE
# =====================================================================
# DO NOT EDIT THIS FILE DIRECTLY. 
# This is the reference template. To generate your live stream.yml, 
# run the onboarding script: python onboarding/bootstrap_stream.py
# 
# Once generated, the stream.yml file will be loaded by agents at runtime.
# =====================================================================


# ---------------------------------------------------------------------
# STREAM ORCHESTRATOR VARIABLES
# Accountable for the domain, targets, and presentation.
# ---------------------------------------------------------------------

# What is the formal name of this Atomic Stream? 
# (Example: Checkout Flow Stream or Core Infrastructure Stream)
stream_name: ""

# Define the bounded product domain this Stream owns. What is in scope, and what is explicitly out of scope?
# (Keep this definitive. Example: 'Owns user authentication. Out of scope: billing.')
product_domain: |
  

# Who are the target user groups for this domain?
# (Example: B2B Admins, Free Tier End-Users)
target_users:
  - 

# What is the current Step 1 Initiative (the measurable outcome target) the Stream is accountable for?
# (Example: 'Increase repeat purchase rate by 15% by Q4')
current_initiative: ""

# What industry does this Stream operate within?
# (Example: FinTech, E-commerce, Healthcare)
industry_context: ""

# List the URLs of existing wikis, API docs, or precedent records agents must reference.
knowledge_repos:
  - 

# Where are the brand guidelines, UI libraries, and tone-of-voice rules located?
presentation_standards: ""

# Describe the personality and tone the agents should use when messaging the team.
# (Note: This only applies to team chat integrations, not generated code)
communication_tone: ""


# ---------------------------------------------------------------------
# SYSTEM ARCHITECT VARIABLES
# Accountable for system coherence and technical boundaries.
# ---------------------------------------------------------------------

# What is the primary tech stack?
# (This determines which baseline security and architecture guardrails are automatically applied)
tech_stack:
  - 

# Beyond standard best practices, what are the absolute architectural boundaries unique to this company?
# (Example: 'Do not invoke any external API without passing through the central gateway layer')
org_specific_limits:
  - 

# Who is the named compliance contact for Tier 3 (irreversible/regulated) release sign-offs?
# (Provide the Slack handle, email, or Discord ID)
tier_3_approver: ""

# Which platform and specific channel should agents use for halt conditions and escalations?
# (Example: #stream-alerts in Discord or Slack)
escalation_channel: ""


# ---------------------------------------------------------------------
# PLATFORM ENGINEERING VARIABLES
# Accountable for routing, access, and pipeline infrastructure.
# ---------------------------------------------------------------------

# What is the base URL of the system of record where Flow Artefacts will be logged?
# (Example: https://jira.yourcompany.com or a Linear team URL)
ticketing_system_url: ""

# What is the URL of the product codebase repository this Stream operates on?
repository_url: ""

# What is the webhook or endpoint URL where agents must send their output to invoke the Scribe service?
scribe_routing_endpoint: ""

# Which external systems or APIs are agents in this Stream explicitly permitted to reach?
allowed_connectors:
  -
